name: Production Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-check:
    name: Run production workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify key production assets
        run: |
          test -f index.html || { echo "Missing required file: index.html"; exit 1; }
          test -f robots.txt || { echo "Missing required file: robots.txt"; exit 1; }
          test -f sitemap.xml || { echo "Missing required file: sitemap.xml"; exit 1; }
